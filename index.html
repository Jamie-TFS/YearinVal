<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Year in VALORANT</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #101014;
      --panel: #1c1c22;
      --border: #2a2a33;
      --text: #f2f2f5;
      --muted: #8a8a93;
      --red: #E62244;
      --blue: #0099E6;
    }

    body {
      font-family: 'Noto Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px;
    }

    h1 {
      font-weight: 800;
      font-size: 48px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--muted);
      margin-bottom: 40px;
      font-size: 18px;
    }

    .signin-btn {
      font-family: inherit;
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
      background: var(--red);
      border: none;
      border-radius: 10px;
      padding: 16px 32px;
      cursor: pointer;
    }

    .signin-btn:hover {
      background: var(--blue);
    }
  </style>
</head>

<body>

  <h1>Your <span style="color: var(--red)">Year</span> in <span style="color: var(--blue)">VALORANT</span></h1>
  <div class="subtitle">Sign in to see your recap.</div>

  <button class="signin-btn" id="signin">Sign in with Riot</button>

  <script>
    document.getElementById("signin").addEventListener("click", function () {
      const state = crypto.randomUUID();
      sessionStorage.setItem("oauth_state", state);
      window.location.href = `login.html?state=${state}`;
    });
  </script>

</body>
</html>
