<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in with Riot</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #101014;
      --panel: #1c1c22;
      --border: #2a2a33;
      --text: #f2f2f5;
      --muted: #8a8a93;
      --red: #E62244;
      --blue: #0099E6;
    }

    body {
      font-family: 'Noto Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px;
    }

    .login-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 40px;
      max-width: 360px;
    }

    h1 {
      font-weight: 800;
      font-size: 28px;
      margin-bottom: 4px;
    }

    .sim-note {
      color: var(--red);
      font-size: 13px;
      margin-bottom: 28px;
    }

    .login-btn {
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      background: var(--red);
      border: none;
      border-radius: 10px;
      padding: 14px 28px;
      cursor: pointer;
      width: 100%;
    }

    .login-btn:hover {
      background: var(--blue);
    }
  </style>
</head>

<body>

  <div class="login-box">
    <h1>Riot Sign-On</h1>
    <div class="sim-note">does nothing; RSO simulation</div>
    <button class="login-btn" id="login">Sign in as Binah#Fairy</button>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const state = params.get("state");

    document.getElementById("login").addEventListener("click", function () {
      const name = "Binah";
      const tag = "Fairy";
      window.location.href = `profile.html?name=${name}-${tag}&state=${state}`;
    });
  </script>

</body>
</html>
