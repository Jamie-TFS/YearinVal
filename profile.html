<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Year in VALORANT</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #101014;
            --panel: #1c1c22;
            --border: #2a2a33;
            --text: #f2f2f5;
            --muted: #8a8a93;
            --red: #E62244;
            --blue: #0099E6;
        }

        body {
            font-family: 'Noto Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
        }

        h1 {
            font-weight: 800;
            margin-bottom: 4px;
        }

        .subtitle {
            color: var(--muted);
            margin-bottom: 32px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
        }

        .label {
            color: var(--muted);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }


        .value.text {
            font-size: 18px;
            font-weight: 600;
            color: var(--text);
        }

        .error {
            color: var(--muted);
            font-size: 18px;
        }

        .share-bar {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 32px;
            flex-wrap: wrap;
        }

        .share-btn {
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
            background: var(--red);
            border: none;
            border-radius: 10px;
            padding: 12px 20px;
            cursor: pointer;
        }

        .share-btn:hover {
            background: var(--blue);
        }

        .share-status {
            color: var(--muted);
            font-size: 14px;
        }

        .share-link {
            color: var(--blue);
            font-size: 14px;
            word-break: break-all;
        }

        .scroll-container {
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
        }

        .slide {
            height: 100vh;
            scroll-snap-align: start;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .value {
            font-size: 40px;
            font-weight: 800;
            color: var(--red);
            text-align: center;
        }

        .agent-portrait {
            display: block;
            max-width: 300px;
            width: 100%;
            height: auto;
            margin-bottom: 24px;
        }
    </style>
</head>

<body>

    <div id="content"></div>

    <script>
        const MY_PUUID = "_oEp3Hu1xJ76_ATFUC89FSWdKPzuL8b4Y2YdL_gABgBArlZccveoSdNViDAyKxUc4BEGvkbFfA1iTw";

        const params = new URLSearchParams(window.location.search);
        const name = params.get("name");
        const returnedState = params.get("state");
        const savedState = sessionStorage.getItem("oauth_state");

        const isOwner = Boolean(returnedState && returnedState === savedState);

        function visibilityKey(profileName) {
            return `visibility_${profileName}`;
        }

        function isProfilePublic(profileName) {
            return localStorage.getItem(visibilityKey(profileName)) === "public";
        }

        function setProfilePublic(profileName, makePublic) {
            localStorage.setItem(
                visibilityKey(profileName),
                makePublic ? "public" : "private"
            );
        }

        if (isOwner) {
            showRecap(name, true);
        } else if (name && isProfilePublic(name)) {
            showRecap(name, false);
        } else if (name) {
            showPrivate(name);
        } else {
            showError();
        }

        function showError() {
            document.getElementById("content").innerHTML =
                `<h1>Something went wrong</h1>
         <div class="error">Invalid link. Please start again from the home page.</div>`;
        }

        function showPrivate(profileName) {
            document.getElementById("content").innerHTML =
                `<h1>This recap is private</h1>
         <div class="error">${profileName} hasn't shared their Year in VALORANT.</div>`;
        }

        function renderShareBar(profileName) {
            const isPublic = isProfilePublic(profileName);
            const shareUrl =
                `${window.location.origin}${window.location.pathname}?name=${encodeURIComponent(profileName)}`;

            if (isPublic) {
                return `
          <div class="share-bar">
            <button class="share-btn" id="toggleShare">Make private</button>
            <span class="share-status">Your recap is public. Share this link:</span>
            <span class="share-link">${shareUrl}</span>
          </div>`;
            }

            return `
        <div class="share-bar">
          <button class="share-btn" id="toggleShare">Share my YearIn</button>
          <span class="share-status">Your recap is private. Only you can see it.</span>
        </div>`;
        }

        async function loadSprays() {
            const response = await fetch("https://valorant-api.com/v1/sprays");
            const data = await response.json();

            return data.data.filter(spray => spray.fullTransparentIcon);
        }

        async function loadAgents() {
            const response = await fetch("https://valorant-api.com/v1/agents");
            const data = await response.json();

            return data.data.filter(agent => agent.isPlayableCharacter);
        }

        async function showRecap(profileName, owner) {
            const response = await fetch("fake_match.json");
            const match = await response.json();

            const totalKills = countMyKills(match);
            const totalDamage = sumMyDamageField(match, "damage");
            const totalLegShots = sumMyDamageField(match, "legshots");
            const totalHeadShots = sumMyDamageField(match, "headshots");
            const totalBodyShots = sumMyDamageField(match, "bodyshots");
            const badRound = countBadRounds(match);

            const agents = await loadAgents();
            const agent = agents[16];
            const shareBar = owner ? renderShareBar(profileName) : "";

            document.getElementById("content").innerHTML = `
  <div class="scroll-container">

    <div class="slide">
      <h1>
        Your <span style="color: var(--red)">Year</span> in
        <span style="color: var(--blue)">VALORANT</span>
      </h1>

      <div class="subtitle">Recap for ${profileName}</div>

      ${agent ? `
        <img
          class="agent-portrait"
          src="${agent.fullPortraitV2}"
          alt="${agent.displayName}"
        >
      ` : ""}
    </div>

    <div class="slide">
      <div class="label">Total kills</div>
      <div class="value">${totalKills}</div>
    </div>

    <div class="slide">
      <div class="label">Total damage</div>
      <div class="value">${totalDamage}</div>
    </div>

    <div class="slide">
      <div class="label">Leg shots</div>
      <div class="value text">
        You shot ${totalLegShots} people in the toes! Ouch.
      </div>
    </div>

    <div class="slide">
      <div class="label">Headshots</div>
      <div class="value text">
        ${totalHeadShots} headshots. Nice crosshair placement!
      </div>
    </div>

  
    <div class="slide">
    <div class="label">Buying a weapon isn't always a good move!</div>
    <div class="value text">
        ${badRound === 0
                    ? "None? Is that even possible?"
                    : `There were ${badRound} times that you should've saved!`
                }
      </div>
    <div class="subtitle">
        ${badRound === 0
                    ? "You never spent credits without getting a kill. Good job, cheater!"
                    : `You spent credits without getting a kill ${badRound} times. Ouch! Consider saving next time!`
                }
     </div>
    </div>


    <div class="slide">
      <div class="label">Bodyshots</div>
      <div class="value text">
        ${totalBodyShots} bodyshots. Cool I guess.
      </div>
    </div>

    ${owner ? `
      <div class="slide">
        ${shareBar}
      </div>
    ` : ""}

  </div>
`;

            if (owner) {
                document.getElementById("toggleShare").addEventListener("click", function () {
                    setProfilePublic(profileName, !isProfilePublic(profileName));
                    showRecap(profileName, true);
                });
            }
        }

        function sumMyDamageField(match, fieldName) {
            let total = 0;

            for (const round of match.roundResults) {
                for (const playerStat of round.playerStats) {
                    if (playerStat.puuid === MY_PUUID) {
                        for (const damageEvent of playerStat.damage) {
                            total += damageEvent[fieldName] ?? 0;
                        }
                    }
                }
            }

            return total;
        }

        function countMyKills(match) {
            let totalKills = 0;

            for (const round of match.roundResults) {
                for (const playerStat of round.playerStats) {
                    if (playerStat.puuid === MY_PUUID) {
                        totalKills += playerStat.kills.length;
                    }
                }
            }

            return totalKills;
        }


        function countBadRounds(match) {
            let badRound = 0;
            for (const round of match.roundResults) {
                for (const playerStat of round.playerStats) {
                    if (playerStat.puuid === MY_PUUID) {
                        if
                            (playerStat.kills.length === 0 &&
                            playerStat.economy.spent >= 1000
                        ) {
                            badRound++;
                        }
                    }
                }
            }

            return badRound;
        }



    </script>

</body>

</html>
